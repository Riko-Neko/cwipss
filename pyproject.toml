[project]
name = "cwipss"
version = "0.1.0"
description = "CWIPSS: reproducible CWT period-candidate search for time-channel spectral data"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "pywavelets",
  "scipy",
  "matplotlib",
  "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
