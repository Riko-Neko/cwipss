[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "cwipss"
version = "0.3.0"
description = "CWIPSS: reproducible CWT period-candidate search for time-channel spectral data"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "pywavelets",
  "scipy",
  "matplotlib",
  "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "perf: long-running randomized performance benchmark sweeps",
]

[tool.scikit-build]
wheel.packages = ["src/cwipss"]
