[project]
name = "cwt-period-search"
version = "0.1.0"
description = "Reproducible CWT period-candidate search pipeline for time-channel data"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "pywavelets",
  "scipy",
  "matplotlib",
  "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
